services:
  postgres:
    image: postgres:17-alpine
    container_name: payment-surface-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payment_surface
    ports:
      - "5432:5432"
    volumes:
      - payment_surface_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payment_surface"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  payment_surface_postgres_data:
